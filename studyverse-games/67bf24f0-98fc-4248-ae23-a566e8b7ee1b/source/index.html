<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Maze Quest</title>
 <link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="game" id="game-screen" aria-label="Maze Quest">
 <section class="field" aria-label="Maze playfield">
  <div class="board" id="board" aria-label="Maze board"></div>
 </section>
 <header class="hud">
  <div class="brand"><h1>MAZE QUEST</h1><small id="progress">Preparing maze</small></div>
  <div class="menu">
   <button id="info" class="glass" type="button" disabled>Question</button>
   <button id="exit" class="glass" type="button" aria-label="Exit to Standard" disabled>X</button>
  </div>
 </header>
 <p class="status" id="status" role="status" aria-live="polite">Connecting to StudyVerse...</p>
 <section id="play-area" class="play-area" hidden>
  <div class="dpad" aria-label="Floating movement controller">
   <div class="control-row"><button id="up" class="direction" type="button" aria-label="Move up">&#8593;</button></div>
   <div class="control-row">
    <button id="left" class="direction" type="button" aria-label="Move left">&#8592;</button>
    <button id="down" class="direction" type="button" aria-label="Move down">&#8595;</button>
    <button id="right" class="direction" type="button" aria-label="Move right">&#8594;</button>
   </div>
  </div>
  <div class="gate-actions" aria-label="Gate actions">
   <button id="confirm" class="enter" type="button" disabled>Enter gate</button>
   <button id="reset" class="glass" type="button">Reset</button>
  </div>
 </section>
 <section id="question-modal" class="modal" role="dialog" aria-label="Question and answer gates" hidden>
  <div class="modal-head"><h2>Question &amp; gates</h2><button id="close-question" class="glass" type="button" aria-label="Return to maze">X</button></div>
  <p class="question" id="question"></p>
  <p id="page-info"></p>
  <div id="options"></div>
  <div class="page-controls">
   <button id="previous" class="glass" type="button">Previous</button>
   <button id="next" class="glass" type="button">Next</button>
  </div>
  <p class="help">Use the arrows or WASD to navigate. The teal player starts on S. Match the numbered gate to your answer; Enter gate submits it. Reading or reaching a gate does not submit.</p>
  <button id="resume" class="enter" type="button">Back to maze</button>
 </section>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
